services:
  - type: web
    name: vigil-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: VIGIL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: VIGIL_LOG_LEVEL
        value: INFO
